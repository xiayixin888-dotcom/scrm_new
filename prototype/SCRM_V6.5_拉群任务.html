<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCRM V6.5｜拉群任务交互原型</title>
  <style>
    :root{--blue:#1677ff;--ink:#1f2937;--muted:#7b8794;--line:#e7edf5;--bg:#f5f7fb;--green:#16a56b;--amber:#d97706;--red:#dc4f4f;--nav:#111b2e}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:flex}.sidebar{width:212px;flex:none;background:var(--nav);color:#bfcae0;padding:20px 12px}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:17px;font-weight:700;padding:2px 10px 26px}.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#2c7df0;font-size:12px}.navtitle{font-size:12px;color:#6f7c94;padding:0 11px;margin:13px 0 7px}.navitem{height:40px;display:flex;align-items:center;gap:10px;border-radius:6px;padding:0 11px;margin:2px 0;color:#c7d2e7}.navitem.active{background:#263b61;color:#fff}.navitem .ico{width:18px;text-align:center;color:#a8bbdc}.navitem.active .ico{color:#78adff}.navsub{padding-left:38px;font-size:13px;color:#9aabc5;margin:-1px 0 8px}.navsub.active{color:#75aaff}.main{flex:1;min-width:900px}.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.crumb{color:#8a96a8}.crumb b{color:#344154;margin-left:6px}.profile{display:flex;align-items:center;gap:10px;color:#556274}.avatar{width:29px;height:29px;background:#e4efff;border-radius:50%;display:grid;place-items:center;color:#347ee8;font-weight:700}.content{padding:24px 28px 88px;max-width:1540px}.heading{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.heading h1{font-size:22px;margin:0 0 4px}.heading p{margin:0;color:var(--muted)}.primary{padding:9px 15px;background:var(--blue);color:#fff;border-radius:5px;font-weight:600;box-shadow:0 3px 7px #1677ff24}.primary:hover{background:#0e65de}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px #22334d05}.filters{display:flex;align-items:center;gap:10px;padding:16px;margin-bottom:14px}.filters input,.select{height:34px;border:1px solid #dbe3ee;border-radius:5px;padding:0 10px;color:#526174;background:#fff}.filters input{width:238px}.select{min-width:126px;display:flex;align-items:center;justify-content:space-between}.filters .spacer{flex:1}.linkbtn{background:none;color:var(--blue);padding:6px}.table{width:100%;border-collapse:collapse}.table th{height:43px;text-align:left;background:#fafcff;color:#69778a;font-weight:500;border-bottom:1px solid var(--line);padding:0 16px;white-space:nowrap}.table td{padding:13px 16px;border-bottom:1px solid #eef2f7;vertical-align:middle}.table tr:last-child td{border:0}.name{font-weight:600;color:#253349}.sub{display:block;font-size:12px;color:#8995a6;margin-top:2px}.tag{display:inline-block;font-size:12px;border-radius:3px;padding:2px 7px;background:#f0f3f8;color:#66758a}.tag.blue{color:#1769d3;background:#eaf3ff}.tag.green{color:#138b5b;background:#e9f8f1}.tag.amber{color:#b66a04;background:#fff5df}.tag.red{color:#cc3f3f;background:#fff0f0}.actions button{background:none;color:var(--blue);padding:2px 7px}.empty{padding:34px;color:#91a0b2;text-align:center}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.metric{padding:17px 19px}.metric label{color:#738196}.metric strong{display:block;font-size:25px;margin-top:3px}.metric .mini{float:right;margin-top:8px}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kanban .column{min-height:340px;padding:14px;background:#edf2f8;border-radius:8px}.ctitle{font-weight:700;margin:0 0 10px}.card{background:#fff;border-radius:7px;border:1px solid #e1e7ef;padding:13px;margin-bottom:10px;box-shadow:0 1px 2px #1d2f4a08}.cardtop{display:flex;justify-content:space-between;align-items:center}.progress{height:5px;background:#e8edf4;border-radius:3px;margin:10px 0 5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:3px}.matrix{overflow:auto}.matrix table{min-width:850px}.cell-ok{color:var(--green);font-size:13px}.cell-run{color:var(--amber);font-size:13px}.cell-fail{color:var(--red);font-size:13px}.vbar{position:fixed;z-index:12;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:20px;background:#152038;color:#fff;box-shadow:0 8px 22px #17264344}.vbar button{background:#344967;color:#fff;border-radius:14px;width:26px;height:26px}.vbar small{color:#b9c8dd;min-width:105px;text-align:center}.modal{position:fixed;inset:0;background:#17243b75;z-index:20;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{width:860px;max-height:88vh;background:#fff;border-radius:10px;box-shadow:0 18px 55px #0d193233;display:flex;flex-direction:column;overflow:hidden}.dialog.small{width:780px}.dhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dhead h2{font-size:18px;margin:0}.close{font-size:22px;line-height:1;background:none;color:#7b8795}.steps{display:flex;border-bottom:1px solid var(--line);padding:15px 28px;gap:45px}.step{color:#8995a5}.step b{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#e9eef5;font-size:12px;margin-right:6px}.step.active{color:var(--blue)}.step.active b{background:var(--blue);color:#fff}.dbody{padding:20px 22px;overflow:auto}.sectiontitle{font-weight:700;margin-bottom:4px}.hint{color:var(--muted);font-size:13px;margin:0 0 14px}.choicegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{position:relative;border:1px solid #e0e6ef;border-radius:7px;padding:13px 14px;display:flex;gap:10px;align-items:flex-start}.choice input{accent-color:var(--blue);margin-top:3px}.choice.disabled{background:#fafafa;opacity:.55}.city{font-size:12px;color:#7e8ca0}.pickbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}.pickbar input{height:34px;border:1px solid #dbe3ee;border-radius:5px;padding:0 10px;width:220px}.grouplist{border:1px solid var(--line);border-radius:7px}.grouprow{display:grid;grid-template-columns:30px 1.7fr 1fr 100px 100px;padding:10px 12px;align-items:center;border-bottom:1px solid #edf1f5}.grouprow:last-child{border:0}.grouprow input{accent-color:var(--blue)}.ghead{background:#fafcff;color:#778498;font-size:12px}.dfoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding:14px 22px}.secondary{padding:8px 14px;background:#fff;border:1px solid #d9e1ec;border-radius:5px;color:#546276}.review{padding:14px;background:#f6f9fd;border:1px solid #e0eaf8;border-radius:7px;margin:12px 0}.review strong{font-size:18px;color:#1769d3}.notice{padding:10px 12px;border-radius:5px;background:#fff8e8;color:#9a650e;font-size:13px}.detailtop{display:flex;gap:28px;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:12px}.detailtop b{display:block;font-size:17px}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:6px}.tabs button{padding:9px 2px;background:none;color:#68768a}.tabs button.active{color:var(--blue);border-bottom:2px solid var(--blue)}
  </style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><span class="logo">365</span>企微 SCRM</div><div class="navtitle">客户管理</div><div class="navitem"><span class="ico">◉</span>所有客户</div><div class="navitem"><span class="ico">▦</span>所有客户群</div><div class="navitem active"><span class="ico">↗</span>拉群任务</div><div class="navsub active">任务列表</div><div class="navtitle">运营工具</div><div class="navitem"><span class="ico">◇</span>渠道链接</div><div class="navitem"><span class="ico">◌</span>群标签</div><div class="navitem"><span class="ico">◷</span>操作记录</div></aside>
<main class="main"><header class="topbar"><div class="crumb">客户管理 <b>/ 拉群任务</b></div><div class="profile"><span>南京⌄</span><span>运营组</span><span class="avatar">夏</span></div></header><section class="content"><div class="heading"><div><h1>拉群任务</h1><p>批量把新增企微账号加入已选历史群，自动处理邀请与通过。</p></div><button class="primary" onclick="openCreate()">+ 新建拉群任务</button></div><div id="view"></div></section></main></div>
<div class="vbar"><button onclick="switchView(-1)" aria-label="上一个视图">←</button><small id="vlabel">A · 任务列表</small><button onclick="switchView(1)" aria-label="下一个视图">→</button></div>

<div class="modal" id="createModal"><div class="dialog"><div class="dhead"><h2>新建拉群任务</h2><button class="close" onclick="closeModal('createModal')">×</button></div><div class="steps"><span class="step active" id="s1"><b>1</b>选择企微账号</span><span class="step" id="s2"><b>2</b>选择历史群</span><span class="step" id="s3"><b>3</b>确认任务</span></div><div class="dbody" id="createBody"></div><div class="dfoot" id="createFoot"></div></div></div>
<div class="modal" id="detailModal"><div class="dialog small"><div class="dhead"><h2>任务详情 · 南京 9 月新二社群拉群</h2><button class="close" onclick="closeModal('detailModal')">×</button></div><div class="dbody" id="detailBody"></div></div></div>

<script>
// PROTOTYPE — Three SCRM 拉群任务 views, switchable with ?variant=a/b/c.
const accounts=[{id:'a1',name:'小李企微',owner:'李晓',ok:true},{id:'a2',name:'小周企微',owner:'周颖',ok:true},{id:'a3',name:'小王企微',owner:'王诚',ok:false},{id:'a4',name:'小陈企微',owner:'陈怡',ok:true}];
const groups=[{id:'g1',name:'南京新二买房讨论 18 群',owner:'张敏',n:386,tag:'可复用',exec:'群主可用'},{id:'g2',name:'南京新二买房讨论 19 群',owner:'张敏',n:412,tag:'可复用',exec:'管理员可用'},{id:'g3',name:'江宁买房交流 06 群',owner:'刘凯',n:438,tag:'可复用',exec:'群主可用'},{id:'g4',name:'河西二手房交流群 12 群',owner:'已离职',n:224,tag:'可复用',exec:'无可用账号'},{id:'g5',name:'南京新二安家交流群 08 群',owner:'赵涵',n:361,tag:'可复用',exec:'群主可用'}];
let taskRows=[{name:'南京 9 月新二社群拉群',creator:'夏艺心',accounts:3,groups:12,total:36,done:28,fail:3,status:'部分完成',time:'今天 10:24'},{name:'江宁历史群账号补充',creator:'王悦',accounts:2,groups:8,total:16,done:16,fail:0,status:'已完成',time:'昨天 16:12'},{name:'河西社群账号补充',creator:'陈怡',accounts:1,groups:15,total:15,done:7,fail:0,status:'执行中',time:'昨天 14:36'}];
let selectedAccounts=['a1','a2'],selectedGroups=['g1','g2','g3'],step=1,variant=['a','b','c'].indexOf(new URLSearchParams(location.search).get('variant'));if(variant<0)variant=0;
const statusTag=s=>`<span class="tag ${s==='已完成'?'green':s==='部分完成'?'amber':'blue'}">${s}</span>`;
function render(){document.getElementById('vlabel').textContent=['A · 任务列表','B · 按账号推进','C · 按群查看'][variant];const v=document.getElementById('view');if(variant===0)v.innerHTML=listView();if(variant===1)v.innerHTML=accountView();if(variant===2)v.innerHTML=groupView()}
function listView(){return `<div class="panel filters"><input placeholder="搜索任务名称"><span class="select">全部状态 <b>⌄</b></span><span class="spacer"></span><button class="linkbtn">重置</button><button class="secondary">查询</button></div><div class="panel"><table class="table"><thead><tr><th>任务名称</th><th>目标账号</th><th>历史群</th><th>执行明细</th><th>任务状态</th><th>创建人</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${taskRows.map((t,i)=>`<tr><td><span class="name">${t.name}</span></td><td>${t.accounts} 个</td><td>${t.groups} 个</td><td><span class="name">${t.done}/${t.total}</span><span class="sub">失败 ${t.fail} 项</span></td><td>${statusTag(t.status)}</td><td>${t.creator}</td><td>${t.time}</td><td class="actions"><button onclick="openDetail(${i})">查看详情</button></td></tr>`).join('')}</tbody></table></div>`}
function accountView(){const cards=[['小李企微','12 个群','10 已完成 / 1 待自动通过 / 1 失败',83,'执行中'],['小周企微','12 个群','11 已完成 / 1 失败',92,'部分完成'],['小陈企微','12 个群','12 已完成',100,'已完成']];return `<div class="summary">${[['本次目标账号','3','blue'],['待处理群邀请','1','amber'],['已完成明细','33','green'],['失败明细','2','red']].map(x=>`<div class="panel metric"><label>${x[0]}</label><strong>${x[1]}</strong><span class="tag ${x[2]} mini">当前任务</span></div>`).join('')}</div><div class="kanban">${['正在处理','已完成','需要关注'].map((col,i)=>`<div class="column"><div class="ctitle">${col} <span class="tag">${i===0?1:i===1?1:1}</span></div>${cards.filter((_,n)=>n%3===i).map(c=>`<div class="card"><div class="cardtop"><b>${c[0]}</b>${statusTag(c[4])}</div><span class="sub">需加入 ${c[1]}</span><div class="progress"><i style="width:${c[3]}%"></i></div><span class="sub">${c[2]}</span></div>`).join('')}</div>`).join('')}</div>`}
function groupView(){return `<div class="panel filters"><input placeholder="搜索群名称"><span class="spacer"></span><span class="tag blue">按历史群查看</span></div><div class="panel matrix"><table class="table"><thead><tr><th>历史群</th><th>当前人数</th><th>邀请执行账号</th><th>小李企微</th><th>小周企微</th><th>小陈企微</th></tr></thead><tbody>${groups.map((g,i)=>`<tr><td><span class="name">${g.name}</span><span class="sub">群主：${g.owner}</span></td><td>${g.n}</td><td>${g.exec}</td><td class="${i===1?'cell-run':'cell-ok'}">${i===1?'待自动通过':'✓ 已入群'}</td><td class="${i===3?'cell-fail':'cell-ok'}">${i===3?'× 无可用账号':'✓ 已入群'}</td><td class="cell-ok">✓ 已入群</td></tr>`).join('')}</tbody></table></div>`}
function switchView(dir){variant=(variant+dir+3)%3;history.replaceState({},'',location.pathname+'?variant='+['a','b','c'][variant]);render()}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')switchView(-1);if(e.key==='ArrowRight')switchView(1)});
function openCreate(){step=1;selectedAccounts=['a1','a2'];selectedGroups=['g1','g2','g3'];document.getElementById('createModal').classList.add('open');renderCreate()}function closeModal(id){document.getElementById(id).classList.remove('open')}
function renderCreate(){[1,2,3].forEach(n=>document.getElementById('s'+n).classList.toggle('active',n===step));const body=document.getElementById('createBody'),foot=document.getElementById('createFoot');if(step===1){body.innerHTML=`<div class="sectiontitle">选择目标企微账号</div><p class="hint">仅展示南京已绑定、可用于执行拉群任务的企微账号。已选账号会加入下一步所选的全部历史群。</p><div class="choicegrid">${accounts.map(a=>`<label class="choice ${a.ok?'':'disabled'}"><input type="checkbox" value="${a.id}" ${selectedAccounts.includes(a.id)?'checked':''} ${a.ok?'':'disabled'} onchange="toggleAccount(this)"><span><b>${a.name}</b><span class="sub">负责人：${a.owner} · 南京</span>${a.ok?'':'<span class="tag red">暂不可用</span>'}</span></label>`).join('')}</div>`;foot.innerHTML=`<button class="secondary" onclick="closeModal('createModal')">取消</button><button class="primary" onclick="nextStep()" ${selectedAccounts.length?'':'disabled'}>下一步</button>`}else if(step===2){body.innerHTML=`<div class="sectiontitle">选择历史群</div><p class="hint">可选择当前有权限查看的南京历史群。人数仅作参考；系统会自动匹配群内可用邀请账号。</p><div class="pickbar"><input placeholder="搜索群名称"><span class="select">全部群标签 <b>⌄</b></span><span class="tag blue">已选 ${selectedGroups.length} 个群</span></div><div class="grouplist"><div class="grouprow ghead"><span></span><span>群名称</span><span>群主</span><span>当前人数</span><span>邀请账号</span></div>${groups.map(g=>`<label class="grouprow"><input type="checkbox" value="${g.id}" ${selectedGroups.includes(g.id)?'checked':''} onchange="toggleGroup(this)"><span><b>${g.name}</b><span class="sub"><span class="tag blue">${g.tag}</span></span></span><span>${g.owner}</span><span>${g.n}</span><span class="${g.exec==='无可用账号'?'cell-fail':'cell-ok'}">${g.exec}</span></label>`).join('')}</div>`;foot.innerHTML=`<button class="secondary" onclick="prevStep()">上一步</button><button class="primary" onclick="nextStep()" ${selectedGroups.length?'':'disabled'}>下一步</button>`}else{const total=selectedAccounts.length*selectedGroups.length;const unavailable=selectedGroups.filter(id=>groups.find(g=>g.id===id).exec==='无可用账号').length*selectedAccounts.length;body.innerHTML=`<div class="sectiontitle">确认拉群任务</div><p class="hint">任务创建后将按账号逐群执行。需要确认的邀请会自动通过；失败项可在详情页单独重试。</p><div class="review"><div>目标企微账号 <strong>${selectedAccounts.length}</strong> 个　×　历史群 <strong>${selectedGroups.length}</strong> 个</div><div class="sub">共生成 ${total} 条执行明细</div></div>${unavailable?`<div class="notice">其中 ${unavailable} 条明细暂无可用邀请账号，创建后会直接标记失败，不影响其他明细执行。</div>`:'<div class="notice" style="background:#edf9f3;color:#16845a">所有已选群均可自动匹配邀请账号，可创建任务。</div>'}`;foot.innerHTML=`<button class="secondary" onclick="prevStep()">上一步</button><button class="primary" onclick="createTask()">创建并开始执行</button>`}}
function toggleAccount(el){selectedAccounts=el.checked?[...selectedAccounts,el.value]:selectedAccounts.filter(x=>x!==el.value);renderCreate()}function toggleGroup(el){selectedGroups=el.checked?[...selectedGroups,el.value]:selectedGroups.filter(x=>x!==el.value);renderCreate()}function nextStep(){if(step<3){step++;renderCreate()}}function prevStep(){if(step>1){step--;renderCreate()}}
function createTask(){const total=selectedAccounts.length*selectedGroups.length;taskRows.unshift({name:'南京历史群拉群 · '+new Date().toLocaleDateString('zh-CN').replaceAll('/','.'),creator:'夏艺心',accounts:selectedAccounts.length,groups:selectedGroups.length,total,done:0,fail:0,status:'执行中',time:'刚刚'});closeModal('createModal');variant=0;history.replaceState({},'',location.pathname+'?variant=a');render()}
function openDetail(i){const t=taskRows[i];document.getElementById('detailBody').innerHTML=`<div class="detailtop"><div><span class="sub">任务状态</span>${statusTag(t.status)}</div><div><span class="sub">执行进度</span><b>${t.done}/${t.total}</b></div><div><span class="sub">失败明细</span><b style="color:${t.fail?'#dc4f4f':'#1f2937'}">${t.fail} 项</b></div><div><span class="sub">创建人</span><b>${t.creator}</b></div></div><div class="tabs"><button class="active">全部明细</button><button>失败项 ${t.fail?`(${t.fail})`:''}</button></div><table class="table"><thead><tr><th>目标账号</th><th>历史群</th><th>执行状态</th><th>结果说明</th><th>操作</th></tr></thead><tbody><tr><td>小李企微</td><td>南京新二买房讨论 18 群</td><td><span class="tag green">已完成</span></td><td>已确认在群</td><td></td></tr><tr><td>小李企微</td><td>南京新二买房讨论 19 群</td><td><span class="tag amber">待自动通过</span></td><td>已发送邀请，等待处理</td><td></td></tr><tr><td>小周企微</td><td>河西二手房交流群 12 群</td><td><span class="tag red">失败</span></td><td>群内无可用邀请账号</td><td class="actions"><button onclick="retry(this)">重试</button></td></tr></tbody></table>`;document.getElementById('detailModal').classList.add('open')}function retry(btn){btn.closest('tr').children[2].innerHTML='<span class="tag blue">待执行</span>';btn.closest('tr').children[3].textContent='已加入重试队列';btn.remove()}
render();
</script>
</body></html>
